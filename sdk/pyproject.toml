[project]
name = "aero-open-sdk"
version = "0.1.0.dev1"
description = "Serial control, actuator mapping and GUI for a tendon-driven dexterous hand."
readme = "README.md"
requires-python = ">=3.10"
maintainers = [{ name = "XDL1234", email = "210893798@qq.com" }]
license = { text = "Apache License 2.0" }

dependencies = [
    "esptool>=5.0.0",
    "pyserial>=3.5",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
aero-open-gui = "aero_open_sdk.gui:main"
